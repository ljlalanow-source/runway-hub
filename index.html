<title>RUNWAY Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Pretendard — fonts/ 폴더에 동봉(KS X 1001 한글 2350자 서브셋). 못 읽으면 Noto Sans KR로 떨어진다 */
  @font-face { font-family: "Pretendard"; font-weight: 100 900; font-display: swap; src: url("fonts/Pretendard.woff2") format("woff2"); }
  /* RUNWAY 허브 — 비핸스 방향(카드 그리드), 라이트 모드 고정. 카드는 결과물 페이지로 새 창에서 연다.
     내용은 data.js 에서만 바꾼다. 이 파일은 다섯 명이 공용으로 쓴다. */
  :root {
    color-scheme: light;
    --ground: #F4F5F7;
    --surface: #FFFFFF;
    --surface-soft: #EBEEF2;
    --ink: #14181C;
    --ink-2: #5B6570;
    --ink-3: #8A939C;
    --line: #DFE3E8;
    --accent: #0057FF;
    --accent-ink: #0043C4;
    --accent-bg: #E9F0FF;
    --accent-text: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,24,28,0.06), 0 10px 30px -12px rgba(20,24,28,0.18);
    --display: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--ground); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  a { color: inherit; }
  .wrap { max-width: 76rem; margin: 0 auto; padding: 0 1.5rem 6rem; }
  .mono { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* 상단 바 — 아래 점선은 활주로 중앙선 */
  .bar {
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.6rem 1.5rem;
    padding: 1.6rem 0 1.1rem;
    border-bottom: 1.5px dashed var(--ink);
    margin-bottom: 4.5rem;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; text-decoration: none; }
  .brand em { font-style: normal; color: var(--accent); }
  .bar nav { display: flex; gap: 1.6rem; }
  .bar nav a { text-decoration: none; }
  .bar nav a:hover, .bar nav a:focus-visible { color: var(--ink); outline: none; }

  /* 히어로 */
  .hero { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 2.5rem 4rem; align-items: end; margin-bottom: 5rem; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; gap: 2rem; } }
  .hero .eyebrow { margin-bottom: 1.1rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .hero .eyebrow span + span::before { content: "·"; margin-right: 0.9rem; }
  .hero h1 {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(1.9rem, 3.8vw, 3rem); line-height: 1.25; letter-spacing: -0.025em; text-wrap: balance;
  }
  .hero .intro { margin: 1.3rem 0 0; max-width: 34rem; color: var(--ink-2); font-size: 1rem; }
  .hero .intro + .intro { margin-top: 0.95rem; }
  .hero .bio { color: var(--ink); font-weight: 500; }
  .hero .intro b { color: var(--ink); font-weight: 500; }
  .goal { border-left: 2px solid var(--accent); padding: 0.2rem 0 0.2rem 1.25rem; }
  .goal .label { margin-bottom: 0.5rem; color: var(--accent-ink); }
  .goal .line { margin: 0; font-family: var(--display); font-size: 1.15rem; font-weight: 600; line-height: 1.5; letter-spacing: -0.01em; text-wrap: balance; }
  .goal .sub { margin: 0.5rem 0 0; color: var(--ink-2); font-size: 0.88rem; }

  /* 섹션 머리 */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; padding-bottom: 0.9rem; border-bottom: 1px solid var(--line); margin-bottom: 1.8rem; }
  .section-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; }

  /* 태그 필터 (profile.showTags 로 켬) */
  .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: -0.6rem 0 1.8rem; }
  .filters button {
    font: inherit; font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.04em; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 0.25rem 0.8rem; line-height: 1.5;
  }
  .filters button:hover { color: var(--ink); border-color: var(--ink-3); }
  .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
  .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filters .count { align-self: center; margin-left: 0.4rem; }

  /* 카드 그리드 */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3rem 2.5rem; }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; gap: 2.4rem; } }
  .card { display: block; text-decoration: none; color: inherit; }
  .card[hidden] { display: none; }
  .thumb {
    position: relative; aspect-ratio: 3 / 2; max-width: 100%;
    border-radius: 6px; overflow: hidden;
    background: var(--surface); box-shadow: var(--shadow);
  }
  .thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(20,24,28,0.06); pointer-events: none; }
  .thumb img, .thumb .tile { transition: transform 0.5s cubic-bezier(.2,.7,.2,1); }
  a.card:hover .thumb img, a.card:hover .thumb .tile, a.card:focus-visible .thumb img, a.card:focus-visible .thumb .tile { transform: scale(1.03); }
  a.card:focus-visible { outline: none; }
  a.card:focus-visible .thumb { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  @media (prefers-reduced-motion: reduce) { .thumb img, .thumb .tile { transition: none; } a.card:hover .thumb img, a.card:hover .thumb .tile { transform: none; } }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 대표 사진이 없을 때 자동으로 그리는 타일 */
  .tile { position: absolute; inset: 0; padding: 1.4rem 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .tt { font-family: var(--display); font-size: clamp(1.3rem, 2.4vw, 1.9rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; text-wrap: balance; align-self: flex-end; text-align: right; max-width: 85%; }
  .tile .td { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.08em; opacity: 0.8; }

  .card-meta { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 1rem; padding: 0.95rem 0.1rem 0; align-items: baseline; }
  .card-meta .log { grid-row: 1 / span 2; padding-top: 0.25rem; }
  .card-meta .t { font-family: var(--display); font-weight: 600; font-size: 1.1rem; line-height: 1.4; letter-spacing: -0.015em; text-wrap: balance; }
  .card-meta .t .arrow { display: inline-block; margin-left: 0.35em; color: var(--accent-ink); opacity: 0; transform: translate(-4px, 2px); transition: opacity 0.2s, transform 0.2s; font-family: var(--body); }
  a.card:hover .t .arrow, a.card:focus-visible .t .arrow { opacity: 1; transform: none; }
  .card-meta .s { font-size: 0.88rem; color: var(--ink-2); }
  .card-meta .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
  .card-meta .tags span { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.04em; border: 1px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 0.05rem 0.55rem; }
  .badge {
    display: inline-block; vertical-align: 0.25em; margin-right: 0.5rem;
    font-family: var(--mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--accent); color: var(--accent-text); border-radius: 3px; padding: 0.1rem 0.45rem;
  }
  .empty { grid-column: 1 / -1; color: var(--ink-2); padding: 3rem 0; text-align: center; }

  /* 강의 목록 — data.js 에 lectures 가 있을 때만 나타난다. 카드가 아니라 목록 */
  .lectures-sec { margin-top: 5.5rem; }
  .lectures-sec[hidden] { display: none; }
  .lectures { list-style: none; margin: 0; padding: 0; }
  .lectures li { border-bottom: 1px solid var(--line); }
  .lectures .lec {
    display: grid; grid-template-columns: 5rem minmax(0, 1fr) auto; gap: 0.15rem 1.5rem; align-items: baseline;
    padding: 1.15rem 0.1rem 1.2rem; text-decoration: none; color: inherit;
  }
  .lectures .no { padding-top: 0.2rem; }
  .lectures .lt { font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.45; letter-spacing: -0.01em; text-wrap: balance; }
  .lectures .lt .arrow { display: inline-block; margin-left: 0.35em; color: var(--accent-ink); opacity: 0; transform: translate(-4px, 2px); transition: opacity 0.2s, transform 0.2s; }
  .lectures a.lec:hover .lt .arrow, .lectures a.lec:focus-visible .lt .arrow { opacity: 1; transform: none; }
  .lectures a.lec:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .lectures .ld { grid-column: 2; color: var(--ink-2); font-size: 0.9rem; }
  .lectures .lm { grid-row: 1 / span 2; grid-column: 3; text-align: right; white-space: nowrap; padding-top: 0.2rem; }
  @media (max-width: 700px) {
    .lectures .lec { grid-template-columns: 5rem minmax(0, 1fr); }
    .lectures .lm { grid-row: auto; grid-column: 2; text-align: left; padding-top: 0.3rem; }
  }

  .note { margin-top: 3.5rem; text-align: center; color: var(--ink-3); font-size: 0.9rem; }
  footer { margin-top: 5rem; padding-top: 1.2rem; border-top: 1.5px dashed var(--ink); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
</style>

<div class="wrap">
  <div class="bar">
    <a class="brand" id="brand" href="#top"></a>
    <nav class="mono" id="nav"><a href="#work">Work</a></nav>
  </div>

  <div class="hero" id="top">
    <div>
      <div class="eyebrow mono" id="eyebrow"></div>
      <h1 id="headline"></h1>
      <p class="intro bio" id="bio"></p>
      <p class="intro" id="intro"></p>
    </div>
    <div class="goal" id="goal" hidden>
      <div class="label mono">2026 엔딩목표</div>
      <p class="line" id="goal-line"></p>
      <p class="sub" id="goal-sub"></p>
    </div>
  </div>

  <div class="section-head" id="work">
    <h2>Work</h2>
    <span class="mono" id="work-count"></span>
  </div>
  <div class="filters" id="filters" aria-label="도구별로 보기"></div>
  <div class="cards" id="grid"></div>

  <div class="lectures-sec" id="lectures" hidden>
    <div class="section-head">
      <h2>Talks</h2>
      <span class="mono" id="lec-count"></span>
    </div>
    <ol class="lectures" id="lec-list"></ol>
  </div>

  <p class="note" id="note"></p>

  <footer class="mono">
    <span id="foot-left"></span>
    <span id="foot-right"></span>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  var D = window.RUNWAY || {};
  var P = D.profile || {};
  var projects = D.projects || [];
  var showTags = P.showTags === true; // 태그 표시는 기본 숨김. data.js의 profile.showTags: true 로 켠다

  // 키컬러 하나(profile.accent)에서 글자용 진한 색·연한 배경·배지 글자색을 자동으로 만든다
  function hexToHsl(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
    var n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, sat = 0, d = max - min;
    if (d) { sat = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) : max === g ? ((b - r) / d + 2) : ((r - g) / d + 4); h /= 6; }
    return { h: h, s: sat, l: l, lum: 0.2126 * r + 0.7152 * g + 0.0722 * b };
  }
  function hslToHex(h, s, l) {
    function f(n) { var k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); var c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); }
    return '#' + f(0) + f(8) + f(4);
  }
  var hsl = hexToHsl(P.accent);
  if (hsl) {
    var R = document.documentElement.style;
    R.setProperty('--accent', P.accent);
    R.setProperty('--accent-ink', P.accentInk || hslToHex(hsl.h, Math.min(hsl.s, 0.9), Math.min(hsl.l, 0.34)));
    R.setProperty('--accent-bg', P.accentBg || hslToHex(hsl.h, hsl.s, 0.94));
    R.setProperty('--accent-text', P.accentText || (hsl.lum > 0.5 ? '#14181C' : '#FFFFFF'));
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function pad(n) { return String(n).padStart(2, '0'); }

  // 헤더 · 히어로 · 푸터
  document.title = P.siteTitle || ((P.name || '') + ' — RUNWAY');
  document.getElementById('brand').innerHTML = esc(P.name) + ' <em>/</em> ' + esc(P.brand || 'AI Runway Log');
  document.getElementById('headline').innerHTML = esc(P.headline || '').replace(/\n/g, '<br>');
  var bio = document.getElementById('bio'); if (P.bio) bio.innerHTML = P.bio; else bio.hidden = true;
  document.getElementById('intro').innerHTML = P.intro || '';
  document.getElementById('note').textContent = P.note || '';
  document.getElementById('foot-left').textContent = (P.name || '') + ' / ' + (P.brand || 'AI Runway Log');
  document.getElementById('foot-right').textContent = '© ' + new Date().getFullYear() + ' ' + (P.name || '');

  var eyebrow = [P.eyebrow || 'AI Runway Log', projects.length + ' entries'];
  document.getElementById('eyebrow').innerHTML = eyebrow.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
  document.getElementById('work-count').textContent = projects.length + ' entries';

  if (P.goal) {
    document.getElementById('goal').hidden = false;
    document.getElementById('goal-line').textContent = P.goal;
    document.getElementById('goal-sub').textContent = P.goalNote || '';
  }

  // 자동 타일 팔레트 — 제목마다 같은 색이 나오게 해시로 고른다
  var tiles = [
    ['#14181C', '#F4F5F7'], ['#0057FF', '#FFFFFF'], ['#FF4D00', '#FFFFFF'],
    ['#EBEEF2', '#14181C'], ['#1FA548', '#FFFFFF'], ['#FF4FA3', '#14181C'], ['#C6F542', '#14181C']
  ];
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function thumbHTML(p, logNo) {
    if (p.thumb) return '<img src="' + esc(p.thumb) + '" alt="">';
    var t = tiles[hash(p.title || p.id || '') % tiles.length];
    return '<div class="tile" style="background:' + t[0] + ';color:' + t[1] + '"><div class="td">LOG ' + pad(logNo) + (p.date ? ' · ' + esc(p.date) : '') + '</div><div class="tt">' + esc(p.title) + '</div></div>';
  }

  // 카드 — 최신이 위. 로그 번호는 오래된 것이 01
  var grid = document.getElementById('grid');
  var cards = projects.map(function (p, i) {
    var logNo = projects.length - i;
    var href = p.url || '';
    var c = el(href ? 'a' : 'div', 'card');
    if (href) { c.href = href; c.target = '_blank'; c.rel = 'noopener'; }
    c.dataset.tags = (p.tags || []).join('|');
    var sub = [p.category, p.date].filter(Boolean).join(' · ');
    c.innerHTML =
      '<div class="thumb">' + thumbHTML(p, logNo) + '</div>' +
      '<div class="card-meta">' +
        '<span class="log mono">Log ' + pad(logNo) + '</span>' +
        '<div class="t">' + (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') + esc(p.title) + (href ? '<span class="arrow" aria-hidden="true">↗</span>' : '') + '</div>' +
        (sub ? '<div class="s">' + esc(sub) + '</div>' : '') +
        (showTags && (p.tags || []).length ? '<div class="tags">' + p.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '</div>';
    grid.appendChild(c);
    return c;
  });
  if (!projects.length) grid.appendChild(el('p', 'empty', '아직 카드가 없습니다. 첫 결과물을 추가해 보세요.'));

  // 태그 필터 — 카드에 실제로 쓰인 도구만 버튼이 된다
  var counts = {};
  projects.forEach(function (p) { (p.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
  var tagList = Object.keys(counts).sort(function (x, y) { return counts[y] - counts[x] || x.localeCompare(y, 'ko'); });
  var filters = document.getElementById('filters');
  if (showTags && tagList.length) {
    var all = el('button', null, '전체'); all.setAttribute('aria-pressed', 'true'); all.dataset.tag = ''; filters.appendChild(all);
    tagList.forEach(function (t) { var bt = el('button', null, esc(t)); bt.setAttribute('aria-pressed', 'false'); bt.dataset.tag = t; filters.appendChild(bt); });
    var count = el('span', 'count mono'); filters.appendChild(count);
    var apply = function (tag) {
      var n = 0;
      cards.forEach(function (c) { var on = !tag || c.dataset.tags.split('|').indexOf(tag) >= 0; c.hidden = !on; if (on) n++; });
      Array.prototype.forEach.call(filters.querySelectorAll('button'), function (bt) { bt.setAttribute('aria-pressed', String(bt.dataset.tag === tag)); });
      count.textContent = n + ' / ' + projects.length;
    };
    filters.addEventListener('click', function (e) { var bt = e.target.closest('button'); if (bt) apply(bt.dataset.tag); });
    apply('');
  }
  if (!filters.children.length) filters.hidden = true;

  // 강의 목록 — data.js 의 lectures 배열. 최신이 위, 번호는 오래된 것이 01. 없으면 탭도 섹션도 안 보인다
  var lectures = D.lectures || [];
  if (lectures.length) {
    var nav = document.getElementById('nav');
    var navA = el('a', null, 'Talks'); navA.href = '#lectures'; nav.appendChild(navA);
    var sec = document.getElementById('lectures'); sec.hidden = false;
    document.getElementById('lec-count').textContent = lectures.length + (lectures.length === 1 ? ' talk' : ' talks');
    var list = document.getElementById('lec-list');
    lectures.forEach(function (L, i) {
      var no = lectures.length - i;
      var li = el('li');
      var a = el(L.url ? 'a' : 'div', 'lec');
      if (L.url) { a.href = L.url; a.target = '_blank'; a.rel = 'noopener'; }
      var meta = [L.session, L.date].filter(Boolean).join(' · ');
      a.innerHTML =
        '<span class="no mono">Talk ' + pad(no) + '</span>' +
        '<div class="lt">' + esc(L.title) + (L.url ? '<span class="arrow" aria-hidden="true">↗</span>' : '') + '</div>' +
        (L.desc ? '<div class="ld">' + esc(L.desc) + '</div>' : '') +
        (meta ? '<span class="lm mono">' + esc(meta) + '</span>' : '');
      li.appendChild(a); list.appendChild(li);
    });
  }

})();
</script>
